<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; }
  body {
    background: #0c0628;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }
  /* nebula glows, echoing the galaxy backdrop */
  .glow { position:absolute; border-radius:50%; filter: blur(90px); }
  .g1 { width:720px; height:720px; left:-220px; top:-300px; background: rgba(124,58,237,.42); }
  .g2 { width:620px; height:620px; right:-200px; bottom:-280px; background: rgba(67,56,202,.40); }
  .g3 { width:380px; height:380px; right:180px; top:-160px; background: rgba(214,51,255,.20); }
  /* starfield */
  .stars { position:absolute; inset:0; }
  .s { position:absolute; background:#fff; border-radius:50%; }
  .content { position:relative; z-index:2; }

  .rule {
    width: 76px; height: 3px; border-radius:2px; margin-bottom: 34px;
    background: linear-gradient(90deg, #21e6ff, rgba(33,230,255,0));
  }
  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 82px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: #21e6ff;
    text-shadow: 0 0 18px rgba(33,230,255,.55), 0 0 44px rgba(33,230,255,.28);
    line-height: 1.05;
  }
  .role {
    margin-top: 26px;
    font-family: 'Space Mono', monospace;
    font-size: 25px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(203,233,255,.72);
  }
  .bio {
    margin-top: 30px;
    font-size: 27px;
    line-height: 1.5;
    color: rgba(239,234,255,.80);
    max-width: 30ch;
  }
  .domain {
    position:absolute; z-index:2;
    left: 96px; bottom: 56px;
    font-family: 'Space Mono', monospace;
    font-size: 21px;
    letter-spacing: 0.16em;
    color: rgba(138,130,166,.95);
  }
  .vignette {
    position:absolute; inset:0; z-index:1;
    background: radial-gradient(ellipse at 30% 45%, rgba(12,6,40,0) 30%, rgba(12,6,40,.72) 100%);
  }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <div class="stars" id="stars"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="rule"></div>
    <h1>Shayan Poigai</h1>
    <div class="role">Software Engineer</div>
    <div class="bio">Full-stack &amp; AI engineer building production systems. CS @ Santa Clara University.</div>
  </div>
  <div class="domain">SHAYANPOIGAI.COM</div>

<script>
  // deterministic star placement so the image is reproducible
  let seed = 20260728;
  const rand = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const wrap = document.getElementById('stars');
  let html = '';
  for (let i = 0; i < 130; i++) {
    const size = rand() < 0.85 ? 2 : 3;
    html += `<i class="s" style="left:${(rand()*1200).toFixed(1)}px;top:${(rand()*630).toFixed(1)}px;width:${size}px;height:${size}px;opacity:${(0.18+rand()*0.65).toFixed(2)}"></i>`;
  }
  wrap.innerHTML = html;
</script>
</body>
</html>
